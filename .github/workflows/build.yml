name: Build executables

# Builds three standalone artifacts, none needing Python or ffmpeg installed
# on the machine that runs them:
#   1. add-frontmatter.exe   — the original command-line tool (Windows only)
#   2. Add-Frontmatter-GUI.exe — the GUI, for Windows
#   3. Add-Frontmatter-GUI.app — the GUI, for Mac
#
# All three bundle a real ffmpeg binary directly into the executable at
# build time (see "Download and cache the ffmpeg binary to bundle" in each
# job below) — nobody running these needs their own internet connection,
# not even on first launch.
#
# Runs on every push to main (so a fresh build is always available from the
# Actions tab), and attaches all three to a GitHub Release when you push a
# version tag like "v1.1.0".
#
# Manual run: Actions tab -> "Build executables" -> "Run workflow".

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-cli-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # needed for the "Attach to release" step to upload assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Download and cache the ffmpeg binary to bundle
        shell: pwsh
        run: |
          $ffmpegPath = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          echo "FFMPEG_PATH=$ffmpegPath" >> $env:GITHUB_ENV
          echo "Bundling ffmpeg from: $ffmpegPath"

      - name: Build add-frontmatter.exe
        # Built from src/run_add_frontmatter.py, not cli.py directly:
        # PyInstaller runs its target as a standalone top-level script, and
        # cli.py uses relative imports (`from .config import ...`) that only
        # resolve when add_frontmatter is imported as a package. --paths src
        # puts src/ on sys.path so `import add_frontmatter.cli` in the
        # wrapper finds the package and those relative imports work.
        # --collect-data tzdata: belt-and-suspenders for the real fix, which
        # is `tzdata` now being a project dependency (see pyproject.toml).
        # zoneinfo (trim.py's auto-trim feature) needs an IANA time zone
        # database to read from; Windows has no system copy of its own, and
        # without tzdata installed at all, the exe failed at startup with
        # "No time zone found with key America/New_York" (the v2.1.1 bug).
        # PyInstaller's own tzdata/zoneinfo hooks already pull it in
        # automatically once it's installed and zoneinfo is imported -- this
        # flag just makes that explicit rather than relying on it silently.
        shell: pwsh
        run: |
          pyinstaller --onefile --name add-frontmatter `
            --paths src `
            --add-binary "$env:FFMPEG_PATH;." `
            --collect-data tzdata `
            src/run_add_frontmatter.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: add-frontmatter-windows
          path: dist/add-frontmatter.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/add-frontmatter.exe

  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Add-Frontmatter-GUI-Windows
            build_path: dist/Add-Frontmatter-GUI.exe
          - os: macos-latest
            artifact_name: Add-Frontmatter-GUI-macOS
            build_path: dist/Add-Frontmatter-GUI.app

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Download and cache the ffmpeg binary to bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegPath = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          echo "FFMPEG_PATH=$ffmpegPath" >> $env:GITHUB_ENV
          echo "Bundling ffmpeg from: $ffmpegPath"

      - name: Download and cache the ffmpeg binary to bundle (Mac)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          FFMPEG_PATH=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          echo "FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "Bundling ffmpeg from: $FFMPEG_PATH"

      - name: Build Add-Frontmatter-GUI.exe (Windows)
        # Built from src/run_add_frontmatter_gui.py for the same reason the
        # CLI build uses its own wrapper script (see that job's comment).
        # --windowed suppresses the console window (this is the whole point
        # for non-developer users). --add-data bundles the app icon/logo
        # assets the GUI reads via importlib-relative paths at runtime.
        # --collect-data tzdata -- see the CLI build step's comment above;
        # same bug, same fix, needed here too.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name Add-Frontmatter-GUI `
            --paths src `
            --add-binary "$env:FFMPEG_PATH;." `
            --add-data "src/add_frontmatter/assets;add_frontmatter/assets" `
            --icon "src/add_frontmatter/assets/sps_logo.ico" `
            --collect-data tzdata `
            src/run_add_frontmatter_gui.py

      - name: Build Add-Frontmatter-GUI.app (Mac)
        # --windowed on macOS makes PyInstaller wrap the result in a proper
        # .app bundle (Contents/MacOS/..., Info.plist, and all) even in
        # --onefile mode, so no separate BUNDLE()/spec-file step is needed.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name Add-Frontmatter-GUI \
            --paths src \
            --add-binary "$FFMPEG_PATH:." \
            --add-data "src/add_frontmatter/assets:add_frontmatter/assets" \
            --icon "src/add_frontmatter/assets/sps_logo.icns" \
            src/run_add_frontmatter_gui.py

      - name: Zip macOS .app (preserves permissions/resource forks)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "${{ matrix.build_path }}" "dist/${{ matrix.artifact_name }}.zip"

      - name: Upload Windows exe as artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.build_path }}
          if-no-files-found: error

      - name: Upload macOS app as artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip
          if-no-files-found: error

      - name: Attach to release (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.build_path }}

      - name: Attach to release (Mac)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}.zip
